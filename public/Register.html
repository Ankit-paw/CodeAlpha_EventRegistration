<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Eventify</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <a href="index.html" class="logo">
            <span class="logo-icon">E</span>
            <span>Eventify</span>
        </a>

        <h1>Create your account</h1>
        <p class="auth-subtitle">Join us and discover amazing events.</p>

        <form id="registerForm">
            <label for="name">Full Name</label>
            <input id="name" type="text" placeholder="Enter your name" required>

            <label for="email">Email Address</label>
            <input id="email" type="email" placeholder="you@example.com" required>

            <label for="password">Password</label>
            <input id="password" type="password" minlength="6"
                   placeholder="Minimum 6 characters" required>

            <button type="submit" class="primary-btn auth-submit">
                Create Account →
            </button>
        </form>

        <p id="registerMessage" class="form-message"></p>

        <p class="auth-switch">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <a href="index.html" class="back-home">← Back to Home</a>
    </div>

    <script src="auth.js"></script>
</body>
</html>
